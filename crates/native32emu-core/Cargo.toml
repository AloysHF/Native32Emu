[package]
name = "native32emu-core"
version.workspace = true
edition.workspace = true
description = "Platform-independent Native32 emulator engine"
license.workspace = true

[lib]
name = "native32emu_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast.workspace = true
image.workspace = true
symphonia.workspace = true
flate2.workspace = true
tempfile = "3"  # Temporary directory management for ZIP extraction

# Only needed by the standalone front-end's audio/input code paths.
minifb = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# ZIP archive extraction for game packages. Native builds keep the crate's
# default backends (bzip2, zstd, lzma, deflate64, …).
zip = "9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Those backends depend on C libraries that do not build under Emscripten, so
# the browser core only carries the pure-Rust deflate path.
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy"] }

[features]
# Enables the minifb/rodio-backed code paths used by the standalone binary.
standalone = ["dep:minifb", "dep:rodio"]
