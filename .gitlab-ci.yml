# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This recipe is consumed by the Libretro buildbot so the Native32Emu core can
# be distributed through RetroArch's Online Updater > Core Downloader.
#
# Native32Emu is written in Rust, so it uses the official Rust CI templates from
# libretro-infrastructure/ci-templates. Those templates run
# `cargo build --release --target <triple>` and rename the produced cdylib to
# `${CORENAME}_libretro.<ext>`. The cdylib lib target is named `native32emu`
# (see crates/native32emu-libretro/Cargo.toml) and the workspace `default-members`
# is set to the libretro core, so the bare cargo build only builds the core.

# Core definitions
.core-defs:
  variables:
    CORENAME: native32emu

include:
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-x64.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-x64.yml'

  # macOS/iOS/tvOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-apple.yml'

  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-android-jni.yml'

  # webOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-webos.yml'

stages:
  - build-prepare
  - build-shared
  - build-static

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-rust-windows-x64-default
    - .core-defs

# Windows 32-bit
# The image ships the 32-bit mingw toolchain alongside the 64-bit one, so as
# above: the target, plus the linker rustc would otherwise guess wrong.
#
# That mingw is gcc 7.3-win32, which on 32-bit x86 uses SJLJ exceptions, while
# rustc's i686-pc-windows-gnu expects DWARF-2 unwinding: its libgcc_eh has no
# _Unwind_Resume, so linking the precompiled std fails. (The 64-bit job is
# unaffected — it uses SEH.) Building std from source with panic=abort removes
# the unwinding machinery altogether, which is also the sounder behaviour for a
# cdylib: a Rust panic must not unwind across the libretro C boundary.
libretro-build-windows-i686:
  extends:
    - .libretro-rust-windows-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-pc-windows-gnu
    CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: i686-w64-mingw32-gcc
    RUSTFLAGS: "-Cpanic=abort"
  before_script:
    - rustup toolchain install nightly --component rust-src
    - rustup +nightly target add i686-pc-windows-gnu
  script:
    - cargo +nightly build --release --target ${TARGET_ARCH} -Z build-std=std,panic_abort

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-rust-linux-x64-default
    - .core-defs

# Linux 32-bit
# Same image and template as the x64 job, only the target changes: the image
# already carries gcc-multilib, so all this needs is the rustup target.
libretro-build-linux-i686:
  extends:
    - .libretro-rust-linux-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-unknown-linux-gnu
  before_script:
    - rustup target add i686-unknown-linux-gnu

# Linux aarch64
# Cross-compiled from the same image as the x64 job, the way that image already
# cross-compiles the Apple and Android arm64 targets. There is no
# rust-linux-aarch64.yml template yet (libretro/libretro-super#2030) and the
# rust image is amd64-only, so the target and its linker are added here.
libretro-build-linux-aarch64:
  extends:
    - .libretro-rust-linux-x64
    - .core-defs
  variables:
    TARGET_ARCH: aarch64-unknown-linux-gnu
    STRIP: aarch64-linux-gnu-strip
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  before_script:
    - apt-get update -qy && apt-get install -yq gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu

# macOS 64-bit
libretro-build-osx-x64:
  extends:
    - .libretro-rust-osx-x86_64-default
    - .core-defs

# macOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-rust-osx-arm64-default
    - .core-defs

# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-rust-android-jni-armeabi-v7a
    - .core-defs

# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-rust-android-jni-arm64-v8a
    - .core-defs

# Android 64-bit x86
android-x86_64:
  extends:
    - .libretro-rust-android-jni-x86_64
    - .core-defs

# Android 32-bit x86
android-x86:
  extends:
    - .libretro-rust-android-jni-x86
    - .core-defs

# iOS
libretro-build-ios-arm64:
  extends:
    - .libretro-rust-ios-arm64-default
    - .core-defs

# tvOS
libretro-build-tvos-arm64:
  extends:
    - .libretro-rust-tvos-arm64-default
    - .core-defs

# webOS
libretro-build-webos-armv7a:
  extends:
    - .libretro-rust-webos-armv7a-default
    - .core-defs
