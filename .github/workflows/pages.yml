name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Redeploy once the rolling nightly release contains the EmulatorJS core.
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fetch EmulatorJS runtime
        env:
          EJS_VERSION: "4.2.3"
        run: |
          mkdir -p site/data
          curl -fsSL "https://cdn.emulatorjs.org/${EJS_VERSION}/data/loader.js" -o site/data/loader.js
          curl -fsSL "https://cdn.emulatorjs.org/${EJS_VERSION}/data/emulator.min.zip" \
            -o "$RUNNER_TEMP/emulatorjs-runtime.zip"
          unzip -oq "$RUNNER_TEMP/emulatorjs-runtime.zip" -d site/data

      - name: Fetch Native32Emu EmulatorJS core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data/cores/reports
          if gh release download nightly-build --repo "$GITHUB_REPOSITORY" \
               --pattern native32-emu-emulatorjs.zip --dir "$RUNNER_TEMP" --clobber; then
            unzip -oq "$RUNNER_TEMP/native32-emu-emulatorjs.zip" -d "$RUNNER_TEMP/ejs-core"
            cp "$RUNNER_TEMP/ejs-core/cores/"*.data site/data/cores/
            cp "$RUNNER_TEMP/ejs-core/cores/reports/"*.json site/data/cores/reports/
          else
            echo "::warning::No EmulatorJS core in the nightly-build release; the online play page will ask for a local game file."
          fi

      - name: Fetch demo game (optional)
        env:
          DEMO_GAME_URL: ${{ vars.NATIVE32_DEMO_GAME_URL }}
        run: |
          if [ -n "${DEMO_GAME_URL:-}" ]; then
            curl -fsSL "$DEMO_GAME_URL" -o site/games/ebblade.zip
          else
            echo "NATIVE32_DEMO_GAME_URL is not set; site/play.html will offer local file selection."
          fi

      - name: Prepare deployment directory
        run: |
          # Copy site files to repo root for deployment
          cp -r site/* .
          # Disable Jekyll processing
          touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
