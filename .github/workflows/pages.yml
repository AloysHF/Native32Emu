name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Redeploy once the rolling nightly release contains the EmulatorJS core.
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fetch EmulatorJS runtime
        env:
          EJS_VERSION: "4.2.3"
        run: |
          EJS_DATA="https://cdn.emulatorjs.org/${EJS_VERSION}/data"
          mkdir -p site/data/compression site/data/localization
          curl -fsSL "$EJS_DATA/loader.js" -o site/data/loader.js
          curl -fsSL "$EJS_DATA/emulator.min.zip" -o "$RUNNER_TEMP/emulatorjs-runtime.zip"
          unzip -oq "$RUNNER_TEMP/emulatorjs-runtime.zip" -d site/data
          # emulator.min.zip only carries the JS/CSS bundles. EmulatorJS loads
          # these on demand, so without them the core .data archive and any
          # ZIP game fail with "Network Error".
          curl -fsSL "$EJS_DATA/compression/extract7z.js" -o site/data/compression/extract7z.js
          curl -fsSL "$EJS_DATA/compression/extractzip.js" -o site/data/compression/extractzip.js
          curl -fsSL "$EJS_DATA/localization/zh-CN.json" -o site/data/localization/zh-CN.json

      - name: Fetch Native32Emu EmulatorJS core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data/cores/reports
          if gh release download nightly-build --repo "$GITHUB_REPOSITORY" \
               --pattern native32-emu-emulatorjs.zip --dir "$RUNNER_TEMP" --clobber; then
            unzip -oq "$RUNNER_TEMP/native32-emu-emulatorjs.zip" -d "$RUNNER_TEMP/ejs-core"
            cp "$RUNNER_TEMP/ejs-core/cores/"*.data site/data/cores/
            cp "$RUNNER_TEMP/ejs-core/cores/reports/"*.json site/data/cores/reports/
          else
            echo "::warning::No EmulatorJS core in the nightly-build release; the online play page will ask for a local game file."
          fi

      - name: Prepare deployment directory
        run: |
          # Copy site files to repo root for deployment
          cp -r site/* .
          # Disable Jekyll processing
          touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
